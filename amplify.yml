version: 1
applications:
  - appRoot: packages/web
    frontend:
      phases:
        preBuild:
          commands:
            - cd ../.. && npm ci
            - cd ../.. && npm run build -w @motory/shared
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: dist
        files:
          - "**/*"
      cache:
        paths:
          - ../../node_modules/**/*
      customHeaders:
        - pattern: "**/*"
          headers:
            - key: Cache-Control
              value: public, max-age=0, must-revalidate
      redirects:
        - source: "</^[^.]+$|\\.(?!(css|gif|ico|jpg|js|png|txt|svg|woff|woff2|ttf|map|json|webp)$)([^.]+$)/>"
          target: /index.html
          status: 200
