AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Motory Inventory MVP - inventario y ventas para talleres de motos

Globals:
  Function:
    Runtime: nodejs20.x
    Architectures:
      - arm64
    Timeout: 29
    MemorySize: 256
    Tracing: Active
    Environment:
      Variables:
        PRODUCTS_TABLE: !Ref ProductsTable
        MOVEMENTS_TABLE: !Ref MovementsTable
        SALES_TABLE: !Ref SalesTable
        CORS_ORIGINS: !Ref CorsOrigins
        ASSETS_BUCKET: !Ref AssetsBucket
        ASSETS_BASE_URL: !Sub "https://${AssetsBucket}.s3.${AWS::Region}.amazonaws.com"

Parameters:
  CorsOrigins:
    Type: String
    Default: "http://localhost:5173,http://127.0.0.1:5173"
    Description: Comma-separated allowed CORS origins

Resources:
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: Prod
      CorsConfiguration:
        AllowOrigins: !Split [",", !Ref CorsOrigins]
        AllowHeaders:
          - Content-Type
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        MaxAge: 86400

  ApiFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/handlers/router.ts
        Minify: true
        Target: es2022
        Sourcemap: false
        Format: cjs
    Properties:
      FunctionName: !Sub "${AWS::StackName}-api"
      CodeUri: ./
      Handler: router.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ProductsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref MovementsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SalesTable
      Events:
        Proxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/v1/{proxy+}
            Method: ANY
        RootProducts:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/v1/products
            Method: ANY
        RootInventory:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/v1/inventory/{proxy+}
            Method: ANY
        RootSales:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/v1/sales
            Method: ANY
        RootSalesId:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/v1/sales/{id}
            Method: ANY
        RootReports:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/v1/reports/{proxy+}
            Method: ANY
        RootDashboard:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/v1/dashboard
            Method: ANY

  ProductsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-products"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: productId
          AttributeType: S
        - AttributeName: gsi1pk
          AttributeType: S
        - AttributeName: gsi1sk
          AttributeType: S
      KeySchema:
        - AttributeName: productId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: gsi1pk
              KeyType: HASH
            - AttributeName: gsi1sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  MovementsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-movements"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: movementId
          AttributeType: S
        - AttributeName: gsi1pk
          AttributeType: S
        - AttributeName: gsi1sk
          AttributeType: S
        - AttributeName: gsi2pk
          AttributeType: S
        - AttributeName: gsi2sk
          AttributeType: S
      KeySchema:
        - AttributeName: movementId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: gsi1pk
              KeyType: HASH
            - AttributeName: gsi1sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: GSI2
          KeySchema:
            - AttributeName: gsi2pk
              KeyType: HASH
            - AttributeName: gsi2sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  SalesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-sales"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: saleId
          AttributeType: S
        - AttributeName: gsi1pk
          AttributeType: S
        - AttributeName: gsi1sk
          AttributeType: S
      KeySchema:
        - AttributeName: saleId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: gsi1pk
              KeyType: HASH
            - AttributeName: gsi1sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  AssetsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-assets"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: false
        IgnorePublicAcls: true
        RestrictPublicBuckets: false
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - "*"
            AllowedMethods:
              - GET
              - HEAD
            AllowedOrigins:
              - "*"
            MaxAge: 86400

  AssetsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AssetsBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: PublicReadBrandAssets
            Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "${AssetsBucket.Arn}/brand/*"

  WebsiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-web"
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: false
        IgnorePublicAcls: true
        RestrictPublicBuckets: false

  WebsiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebsiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: PublicReadWebsite
            Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "${WebsiteBucket.Arn}/*"

Outputs:
  ApiUrl:
    Description: Motory HTTP API base URL
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/Prod"
  AssetsBucketName:
    Description: S3 bucket for Motory brand assets
    Value: !Ref AssetsBucket
  LogoUrl:
    Description: Public Motory logo URL
    Value: !Sub "https://${AssetsBucket}.s3.${AWS::Region}.amazonaws.com/brand/logo.jpg"
  WebsiteBucketName:
    Description: S3 bucket for Motory web app
    Value: !Ref WebsiteBucket
  WebsiteUrl:
    Description: Motory web static website URL
    Value: !Sub "http://${WebsiteBucket}.s3-website-${AWS::Region}.amazonaws.com"
  ProductsTableName:
    Value: !Ref ProductsTable
  MovementsTableName:
    Value: !Ref MovementsTable
  SalesTableName:
    Value: !Ref SalesTable